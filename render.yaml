services:
  - type: web
    name: know-your-presence
    env: node
    plan: free
    buildCommand: npm install && (apt-get install -y chromium-browser 2>/dev/null || true) && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright-browsers npx playwright install chromium 2>/dev/null || true
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: reports@knowyourpresence.com
      - key: OWNER_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: URLSCAN_API_KEY
        sync: false
      - key: META_ADS_ACCESS_TOKEN
        sync: false
      - key: DODO_SECRET_KEY
        sync: false
      - key: DODO_WEBHOOK_SECRET
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright-browsers
